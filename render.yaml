services:
  - type: web
    name: api-chris
    runtime: python
    region: oregon
    plan: free
    rootDir: backend/api-chris
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12"

  - type: web
    name: api-jack
    runtime: python
    region: oregon
    plan: free
    rootDir: backend/api-jack
    buildCommand: pip install -r requirements.txt gunicorn
    startCommand: gunicorn app.main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12"

  - type: web
    name: api-jurne
    runtime: docker
    region: oregon
    plan: free
    rootDir: backend/api-jurne/ticketmaster-backend
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true

  - type: web
    name: api-gateway
    runtime: python
    region: oregon
    plan: free
    rootDir: backend/api-gateway
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_CHRIS_URL
        sync: false
      - key: API_JACK_URL
        sync: false
      - key: API_JURNE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12"

  - type: web
    name: frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: dist
